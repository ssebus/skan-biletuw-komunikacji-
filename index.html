<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Ticket OCR Scanner - DB & VRM</title>
    <!-- Ładowanie silnika Tesseract.js do prawdziwego OCR z CDN -->
    <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #60a5fa;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .scanner-box {
            border: 2px dashed #475569;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: rgba(15, 23, 42, 0.4);
            margin-bottom: 20px;
        }

        .scanner-box:hover {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
        }

        .scanner-box input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* ANIMATED STATUS SKINS */
        .status-badge {
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 20px;
            display: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-badge.valid {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            border: 2px solid var(--success);
            animation: pulse-green 2s infinite;
            display: block;
        }

        .status-badge.invalid {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 2px solid var(--danger);
            animation: pulse-red 2s infinite;
            display: block;
        }

        .status-badge.uncertain {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            border: 2px solid var(--warning);
            animation: pulse-orange 2s infinite;
            display: block;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        @keyframes pulse-orange {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        /* DATA TABLE */
        .data-table-container {
            display: none;
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: #0f172a;
            border-radius: 8px;
            overflow: hidden;
        }

        .data-table th, .data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #334155;
            font-size: 0.9rem;
        }

        .data-table th {
            background: #1e293b;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .data-table td:first-child {
            font-weight: bold;
            color: #93c5fd;
            width: 45%;
        }

        .preview-image {
            max-width: 100%;
            max-height: 180px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            object-fit: contain;
        }

        .loader {
            display: none;
            color: var(--accent);
            margin: 15px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Real Ticket OCR Scanner</h1>
        <p>Prawdziwy odczyt danych z biletów Deutsche Bahn, VRM i innych</p>
    </header>

    <div class="container">
        <div class="scanner-box" id="dropZone">
            <img id="previewImage" class="preview-image" alt="Podgląd biletu">
            <div id="scannerText">
                <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-bottom: 10px; color: #60a5fa;"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <p>Kliknij lub wgraj zdjęcie swojego biletu</p>
                <small style="color: var(--text-secondary);">Silnik OCR odczyta rzeczywisty tekst z grafiki</small>
            </div>
            <input type="file" id="fileInput" accept="image/*" onchange="processImage(this)">
        </div>

        <div id="loader" class="loader" style="text-align: center;">Trwa skanowanie i analiza tekstu OCR... ⏳</div>

        <div id="statusBadge" class="status-badge"></div>

        <div id="dataTableContainer" class="data-table-container">
            <h3 style="font-size: 1rem; margin-bottom: 10px; color: var(--text-secondary);">Odczytane faktyczne dane:</h3>
            <table class="data-table">
                <tbody id="tableBody">
                    <!-- Dynamicznie wstawiane tylko znalezione dane -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function processImage(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            
            // Pokaż podgląd zdjęcia
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('previewImage');
                preview.src = e.target.result;
                preview.style.display = 'block';
                document.getElementById('scannerText').style.display = 'none';
            }
            reader.readAsDataURL(file);

            // Pokaż loader
            document.getElementById('loader').style.display = 'block';
            document.getElementById('statusBadge').style.display = 'none';
            document.getElementById('dataTableContainer').style.display = 'none';

            try {
                // Uruchomienie prawdziwego silnika OCR (obsługa j. polskiego i niemieckiego/angielskiego)
                const result = await Tesseract.recognize(
                    file,
                    'deu+eng+pol',
                    { 
                        logger: m => console.log(m) 
                    }
                );

                const rawText = result.data.text;
                console.log("OCR Raw Text:", rawText);
                
                // Analiza i parsowanie wyłącznie prawdziwych danych
                parseRealTicketData(rawText, result.data.confidence);

            } catch (error) {
                alert("Błąd podczas skanowania OCR: " + error);
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        function parseRealTicketData(text, confidence) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const extractedData = {};

            // 1. Wykrywanie wystawcy (Deutsche Bahn, VRM, itp.)
            const lowerText = text.toLowerCase();
            if (lowerText.includes("deutsche bahn") || lowerText.includes("db")) {
                extractedData["Wydawca"] = "Deutsche Bahn (DB)";
            } else if (lowerText.includes("vrm")) {
                extractedData["Wydawca"] = "VRM (Verkehrsverbund Rhein-Mosel)";
            }

            // 2. Wykrywanie typu biletu
            if (lowerText.includes("deutschlandticket") || lowerText.includes("d-ticket")) {
                extractedData["Typ biletu"] = "Deutschlandticket";
            } else if (lowerText.includes("fahrkarte") || lowerText.includes("ticket")) {
                extractedData["Typ biletu"] = "Bilet / Fahrkarte";
            } else if (lowerText.includes("tageskarte")) {
                extractedData["Typ biletu"] = "Bilet całodzienny (Tageskarte)";
            }

            // 3. Szukanie relacji (Skąd -> Dokąd) - jeśli na bilecie jest np. "Bonn -> Koblenz" lub "Von: ... Nach: ..."
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                // Szukanie oznaczeń relacji
                if (line.toLowerCase().startsWith("von") || line.toLowerCase().startsWith("skąd")) {
                    extractedData["Skąd"] = line.replace(/^(von|skąd)[:\s]*/i, '');
                }
                if (line.toLowerCase().startsWith("nach") || line.toLowerCase().startsWith("dokąd")) {
                    extractedData["Dokąd"] = line.replace(/^(nach|dokąd)[:\s]*/i, '');
                }
            }

            // 4. Szukanie dat ważności (wzorce typu DD.MM.YYYY)
            const dateRegex = /\b(0[1-9]|[12][0-9]|3[01])\.(0[1-9]|1[0-2])\.20[2-9][0-9]\b/g;
            const dates = text.match(dateRegex);
            if (dates && dates.length > 0) {
                extractedData["Ważny od / Data"] = dates[0];
                if (dates.length > 1) {
                    extractedData["Ważny do"] = dates[1];
                }
            }

            // 5. Szukanie imienia i nazwiska (wzorice wielkich liter lub słowa typu Name / Fahrgast)
            for (let line of lines) {
                if (line.toLowerCase().includes("name") || line.toLowerCase().includes("fahrgast")) {
                    // Czasami nazwisko jest w tej samej lub kolejnej linii
                    let cleanName = line.replace(/(name|fahrgast)[:\s]*/gi, '').trim();
                    if (cleanName.length > 2) {
                        extractedData["Imię i Nazwisko"] = cleanName;
                    }
                }
            }

            // Dodaj surowy kod / ID jeśli wykryto ciąg cyfr/liter pasujący do numeru biletu
            const numRegex = /\b([A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4})\b/g;
            const numbers = text.match(numRegex);
            if (numbers) {
                extractedData["Numer biletu"] = numbers[0];
            }

            // Weryfikacja daty (czy minęła czy nie)
            let status = "valid";
            let statusText = "🟢 Bilet Ważny";

            // Prosta walidacja daty "Ważny do" jeśli została znaleziona
            if (extractedData["Ważny do"]) {
                const parts = extractedData["Ważny do"].split('.');
                const expDate = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
                const today = new Date();
                
                if (expDate < today) {
                    status = "invalid";
                    statusText = "🔴 Bilet Nieważny (Minęła data ważności)";
                }
            }

            // Jeśli pewność OCR jest bardzo niska lub brak kluczowych danych
            if (confidence < 50 || Object.keys(extractedData).length <= 1) {
                status = "uncertain";
                statusText = "🟠 Niepewny odczyt / Brak pewności danych";
            }

            // Wyświetlenie wyniku w tabeli (TYLKO FAKTYCZNIE ZNALEZIONE DANE, brak pustych lub zmyślonych pól)
            renderTable(extractedData, status, statusText);
        }

        function renderTable(data, status, statusText) {
            const badge = document.getElementById('statusBadge');
            badge.className = `status-badge ${status}`;
            badge.innerText = statusText;

            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            // Generowanie wierszy dynamicznie tylko dla tego, co faktycznie wykryto
            for (const [key, value] of Object.entries(data)) {
                const row = document.createElement('tr');
                row.innerHTML = `<td>${key}:</td><td>${value}</td>`;
                tableBody.appendChild(row);
            }

            // Jeśli nic konkretnego nie wykryto
            if (Object.keys(data).length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = `<td>Informacja:</td><td>Nie udało się odczytać żadnych danych z tego zdjęcia. Spróbuj wyraźniejszego ujęcia.</td>`;
                tableBody.appendChild(row);
            }

            document.getElementById('dataTableContainer').style.display = 'block';
        }
    </script>
</body>
</html>
