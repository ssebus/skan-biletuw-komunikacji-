<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitPass Pro - Skaner Kart i Kodów QR</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --success-color: #22c55e;
            --danger-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #60a5fa;
        }

        .scanner-box {
            position: relative;
            width: 100%;
            height: 250px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #475569;
            margin-bottom: 20px;
        }

        .scanner-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scan-laser {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-color);
            animation: scan 2s infinite ease-in-out;
        }

        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 1rem;
        }

        .btn-primary { background: var(--accent-color); color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: #475569; color: white; }
        .btn-secondary:hover { background: #334155; }

        /* Skin karty z animacją */
        .ticket-skin {
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: none;
        }

        .ticket-skin.valid {
            background: linear-gradient(135deg, #065f46, #047857);
            border: 2px solid var(--success-color);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
            animation: pulse-valid 2s infinite;
        }

        .ticket-skin.invalid {
            background: linear-gradient(135deg, #7f1d1d, #991b1b);
            border: 2px solid var(--danger-color);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
            animation: shake 0.5s ease-in-out;
        }

        @keyframes pulse-valid {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .status-badge {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Tabela danych */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 10px;
        }

        th, td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid #1e293b;
            font-size: 0.9rem;
        }

        th {
            background: #1e293b;
            color: #94a3b8;
            width: 40%;
        }

        td {
            color: #f1f5f9;
        }

        .manual-input {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .manual-input input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>TransitPass Pro Skaner</h1>
        
        <div class="scanner-box">
            <div class="scan-laser"></div>
            <video id="video" autoplay playsinline></video>
        </div>

        <div class="controls">
            <button class="btn-primary" onclick="startScanner()">Włącz Kamerę</button>
            <button class="btn-secondary" onclick="simulateScan()">Symuluj Skan (Test)</button>
        </div>

        <div class="manual-input">
            <input type="text" id="manualCode" placeholder="Wpisz treść kodu/biletu ręcznie...">
            <button class="btn-primary" style="flex: 0.5;" onclick="processData(document.getElementById('manualCode').value)">Sprawdź</button>
        </div>

        <!-- Skin Wyniku -->
        <div id="ticketSkin" class="ticket-skin">
            <div id="statusBadge" class="status-badge"></div>
            <div id="statusDesc" style="font-size: 0.9rem; opacity: 0.9; margin-bottom: 12px;"></div>
            
            <table>
                <tr><th>Nazwisko / Imię</th><td id="resName">-</td></tr>
                <tr><th>Typ Biletu</th><td id="resType">-</td></tr>
                <tr><th>Ważność do</th><td id="resExpiry">-</td></tr>
                <tr><th>Status</th><td id="resStatus">-</td></tr>
                <tr><th>Odczytany Kod / ID</th><td id="resCode">-</td></tr>
            </table>
        </div>
    </div>

    <!-- Biblioteka do obsługi kodów QR -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script>
        const video = document.getElementById('video');
        const ticketSkin = document.getElementById('ticketSkin');
        const statusBadge = document.getElementById('statusBadge');
        const statusDesc = document.getElementById('statusDesc');
        
        let scanning = false;
        let stream = null;

        async function startScanner() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.play();
                scanning = true;
                requestAnimationFrame(tick);
            } catch (err) {
                alert("Błąd dostępu do kamery: " + err.message + "\nUżyj symulacji lub wpisz kod ręcznie.");
            }
        }

        function tick() {
            if (!scanning) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const canvasElement = document.createElement('canvas');
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                const canvas = canvasElement.getContext('2d');
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                
                const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
                if (code) {
                    processData(code.data);
                    scanning = false;
                    if (stream) stream.getTracks().forEach(track => track.stop());
                    return;
                }
            }
            requestAnimationFrame(tick);
        }

        function simulateScan() {
            // Przykładowe losowe dane biletu do testów
            const samples = [
                "PASS|Kowalski Jan|Miesieczny Autobus|2027-12-31|ID:9823471",
                "PASS|Nowak Anna|Jednorazowy Pociag|2025-01-01|ID:1234567",
                "TRAIN_TICKET;Zielinski Piotr;Bilet Iztek;2028-05-15;OK"
            ];
            const randomSample = samples[Math.floor(Math.random() * samples.length)];
            processData(randomSample);
        }

        function processData(rawText) {
            if (!rawText.trim()) {
                alert("Brak danych do przetworzenia!");
                return;
            }

            // Parsowanie danych z tekstu kodu (obsługa separatorów | lub ;)
            let parts = rawText.includes('|') ? rawText.split('|') : rawText.split(';');
            
            let name = parts[1] || "Nieznany / Karta Anonimowa";
            let type = parts[2] || "Bilet Standardowy";
            let expiryStr = parts[3] || "2026-12-31";
            let codeId = parts[4] || rawText;

            // Sprawdzanie ważności daty
            let expiryDate = new Date(expiryStr);
            let currentDate = new Date();
            let isValid = !isNaN(expiryDate) && expiryDate >= currentDate;

            // Wyświetlenie odpowiedniego skinu i animacji
            ticketSkin.style.display = 'block';
            ticketSkin.className = "ticket-skin " + (isValid ? "valid" : "invalid");

            if (isValid) {
                statusBadge.innerHTML = "✅ BILET WAŻNY";
                statusDesc.innerText = "Karta została pomyślnie zweryfikowana. Przejście dozwolone.";
                document.getElementById('resStatus').innerHTML = "<strong style='color:var(--success-color)'>WAŻNY</strong>";
            } else {
                statusBadge.innerHTML = "❌ BILET NIEWAŻNY / WYGASŁ";
                statusDesc.innerText = "Uwaga! Okres ważności biletu minął lub kod jest niepoprawny.";
                document.getElementById('resStatus').innerHTML = "<strong style='color:var(--danger-color)'>NIEWAŻNY</strong>";
            }

            // Wypełnienie tabeli danych
            document.getElementById('resName').innerText = name;
            document.getElementById('resType').innerText = type;
            document.getElementById('resExpiry').innerText = expiryStr;
            document.getElementById('resCode').innerText = codeId;
        }
    </script>
</body>
</html>
