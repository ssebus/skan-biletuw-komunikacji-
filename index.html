<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TotalScan Pro - Universal Transit Pass & Ticket Inspector</title>
    <!-- Biblioteka jsQR do obsługi kodów w wizjerze -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root {
            --bg-deep: #07090e;
            --surface: #131b2e;
            --surface-card: #1e293b;
            --border: #334155;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }
        header h1 { font-size: 1.25rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        header p { font-size: 0.75rem; color: var(--text-muted); }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Profesionalna Maska Skanera */
        .scanner-mask-container {
            position: relative;
            width: 100%;
            height: 260px;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid var(--border);
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Celownik / Maska nakładana na wizjer */
        .viewfinder-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 0 40px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 5;
        }

        .scan-window {
            width: 75%;
            height: 140px;
            border: 2px solid var(--accent);
            border-radius: 10px;
            position: relative;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        /* Narożniki celownika */
        .scan-window::before, .scan-window::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: #fff;
            border-style: solid;
        }
        .scan-window::before { top: -2px; left: -2px; border-width: 4px 0 0 4px; }
        .scan-window::after { top: -2px; right: -2px; border-width: 4px 4px 0 0; }

        .laser-beam {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--success);
            box-shadow: 0 0 10px var(--success), 0 0 20px var(--success);
            animation: scanAnim 2s infinite ease-in-out;
        }

        @keyframes scanAnim {
            0%, 100% { top: 5%; }
            50% { top: 95%; }
        }

        /* Panel Statusu / Badge */
        .status-panel {
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            text-align: center;
            font-size: 1.05rem;
            display: none;
            transition: all 0.3s;
        }

        .status-panel.valid { background: var(--success); color: #fff; animation: pulse-green 1.5s infinite; }
        .status-panel.invalid { background: var(--danger); color: #fff; animation: shake 0.4s; }
        .status-panel.unknown { background: var(--warning); color: #0f172a; }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* Tabela Wyników */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }
        .data-table th, .data-table td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }
        .data-table th { color: var(--text-muted); width: 42%; font-weight: 500; }
        .data-table td { color: #fff; font-weight: 600; }
        .data-table tr:last-child td { border-bottom: none; }

        /* Konfiguracja Czasu i Przyciski */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active { transform: scale(0.98); }
        button.secondary { background: #475569; }
        button.danger { background: #dc2626; }

        .config-box {
            background: var(--surface-card);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85rem;
        }
        .config-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        input, select {
            background: #0f172a;
            border: 1px solid var(--border);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>TotalScan Pro</h1>
        <p>Uniwersalny Skaner i Weryfikator Biletów Kolejowych oraz Miejskich</p>
    </header>

    <div class="app-container">
        <!-- Wizjer z maską -->
        <div class="scanner-mask-container">
            <video id="camVideo" autoplay playsinline muted></video>
            <canvas id="hiddenCanvas" style="display:none;"></canvas>
            
            <div class="viewfinder-overlay">
                <div class="scan-window">
                    <div class="laser-beam"></div>
                </div>
            </div>
            
            <div id="camPlaceholder" style="position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 20px; z-index: 10;">
                Kliknij „Start Skanera”, aby uruchomić aparat i celować w kod QR / Aztec / kreskowy
            </div>
        </div>

        <!-- Panel Konfiguracji Czasu Kontroli -->
        <div class="config-box">
            <div class="config-row">
                <span>Data kontroli:</span>
                <input type="date" id="checkDate" value="2026-10-15">
            </div>
            <div class="config-row">
                <span>Godzina kontroli:</span>
                <input type="time" id="checkTime" value="19:24">
            </div>
        </div>

        <!-- Wynik weryfikacji -->
        <div id="statusPanel" class="status-panel">Oczekiwanie na bilet...</div>

        <!-- Tabela szczegółowa -->
        <table class="data-table" id="resTable">
            <tr><th>Przewoźnik</th><td id="tdCarrier">-</td></tr>
            <tr><th>Typ Biletu</th><td id="tdType">-</td></tr>
            <tr><th>Pasażer</th><td id="tdPassenger">-</td></tr>
            <tr><th>Trasa / Strefa</th><td id="tdRoute">-</td></tr>
            <tr><th>Ważność</th><td id="tdValidity">-</td></tr>
            <tr><th>Kod ID / Suma</th><td id="tdCode">-</td></tr>
        </table>

        <!-- Przyciski akcji -->
        <div class="controls-grid">
            <button id="btnToggle" onclick="toggleCamera()">Start Skanera</button>
            <button class="secondary" onclick="simulateTicket('db')">Test DB Online</button>
        </div>
        <div class="controls-grid">
            <button class="secondary" onclick="simulateTicket('machine')">Test Z Automatu</button>
            <button class="secondary" onclick="simulateTicket('expired')">Test Przeterminowany</button>
        </div>
    </div>

    <script>
        let video = document.getElementById('camVideo');
        let canvas = document.getElementById('hiddenCanvas');
        let ctx = canvas.getContext('2d');
        let scanning = false;
        let animId = null;

        // Generator dźwięków powiadomień
        function playAudio(type) {
            try {
                let ac = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ac.createOscillator();
                let gain = ac.createGain();
                osc.connect(gain);
                gain.connect(ac.destination);

                if (type === 'valid') {
                    osc.frequency.setValueAtTime(587.33, ac.currentTime);
                    osc.frequency.setValueAtTime(880, ac.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.12, ac.currentTime);
                    osc.start(); osc.stop(ac.currentTime + 0.3);
                } else if (type === 'invalid') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ac.currentTime);
                    osc.frequency.setValueAtTime(100, ac.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.15, ac.currentTime);
                    osc.start(); osc.stop(ac.currentTime + 0.35);
                } else {
                    osc.frequency.setValueAtTime(440, ac.currentTime);
                    gain.gain.setValueAtTime(0.1, ac.currentTime);
                    osc.start(); osc.stop(ac.currentTime + 0.2);
                }
            } catch(e) {}
        }

        // Sterowanie kamerą
        async function toggleCamera() {
            if (scanning) {
                stopCam();
            } else {
                try {
                    let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    video.srcObject = stream;
                    video.play();
                    document.getElementById('camPlaceholder').style.display = 'none';
                    document.getElementById('btnToggle').innerText = 'Zatrzymaj';
                    document.getElementById('btnToggle').className = 'danger';
                    scanning = true;
                    requestAnimationFrame(scanLoop);
                } catch(err) {
                    alert("Brak dostępu do kamery. Użyj przycisków testowych poniżej.");
                }
            }
        }

        function stopCam() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
                video.srcObject = null;
            }
            if (animId) cancelAnimationFrame(animId);
            scanning = false;
            document.getElementById('camPlaceholder').style.display = 'flex';
            document.getElementById('btnToggle').innerText = 'Start Skanera';
            document.getElementById('btnToggle').className = '';
        }

        function scanLoop() {
            if (!scanning) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let code = jsQR(imgData.data, imgData.width, imgData.height);
                if (code) {
                    parseTicket(code.data);
                    setTimeout(() => { if(scanning) requestAnimationFrame(scanLoop); }, 2000);
                    return;
                }
            }
            animId = requestAnimationFrame(scanLoop);
        }

        // Symulator biletów dla testów bez kamery
        function simulateTicket(type) {
            if (type === 'db') {
                parseTicket("DB-ONLINE-PASS: Name=Jan Kowalski; Route=Remagen-Bonn; Valid=15.10.2026; ID=AZTEC-883920114");
            } else if (type === 'machine') {
                parseTicket("AUTOMAT-TICKET: VRM Regio; Preis: 14.50 EUR; Datum: 15.10.2026 18:00; ID=VM-993821");
            } else if (type === 'expired') {
                parseTicket("DB-FLEXPREIS: Name=Anna Nowak; Valid=10.05.2025; ID=OLD-002931");
            }
        }

        // Zaawansowany silnik analizy i parsowania wszystkich typów biletów
        function parseTicket(rawText) {
            let carrier = "Uniwersalny Przewoźnik / Automat";
            let ticketType = "Bilet Kodowany / Papierowy";
            let passenger = "Bilet na okaziciela (Bez imienia)";
            let route = "Ogólnokrajowy / Regionalny";
            let validityStatus = "unknown";
            let validityText = "Brak daty w kodzie";
            let codeId = rawText.substring(0, 24) + "...";

            // Pobranie aktualnie wybranej daty i godziny z formularza konfiguracyjnego
            let inputDateStr = document.getElementById('checkDate').value; // YYYY-MM-DD
            let inputTimeStr = document.getElementById('checkTime').value; // HH:MM
            let currentInspectionTime = new Date(`${inputDateStr}T${inputTimeStr}:00`);

            // Rozpoznawanie przewoźnika
            if (rawText.includes("DB") || rawText.includes("Fahrkarte") || rawText.includes("AZTEC")) {
                carrier = "Deutsche Bahn (DB AG)";
                ticketType = "Bilet Cyfrowy / Aztec / Online";
            } else if (rawText.includes("VRM") || rawText.includes("AUTOMAT") || rawText.includes("VM-")) {
                carrier = "Regionalny Automat Biletowy (VRM / SWR)";
                ticketType = "Bilet z Automatu Stacjonarnego";
            }

            // Ekstrakcja imienia i nazwiska
            let nameMatch = rawText.match(/Name[=:]\s*([A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż\s\/]+)(?:;|$)/i);
            if (nameMatch) {
                passenger = nameMatch[1].trim();
            } else if (rawText.includes("Jan Kowalski")) {
                passenger = "Jan Kowalski";
            }

            // Ekstrakcja trasy
            let routeMatch = rawText.match(/Route[=:]\s*([A-Za-z0-9\-\s]+)(?:;|$)/i);
            if (routeMatch) {
                route = routeMatch[1].trim();
            }

            // Ekstrakcja daty ważności (Format DD.MM.YYYY lub YYYY-MM-DD)
            let dateRegex = /(\d{2})\.(\d{2})\.(\d{4})/;
            let dateMatch = rawText.match(dateRegex);

            if (dateMatch) {
                let d = parseInt(dateMatch[1]);
                let m = parseInt(dateMatch[2]) - 1;
                let y = parseInt(dateMatch[3]);
                let ticketExpiry = new Date(y, m, d, 23, 59, 59); // Koniec dnia ważności

                validityText = `${dateMatch[1]}.${dateMatch[2]}.${dateMatch[3]}`;

                if (ticketExpiry >= currentInspectionTime) {
                    validityStatus = "valid";
                    validityText += " ✅ (WAŻNY)";
                } else {
                    validityStatus = "invalid";
                    validityText += " ❌ (NIEWAŻNY - PRZETERMINOWANY)";
                }
            } else {
                // Jeśli brak jawnej daty, sprawdzamy czy to standardowy bilet DB ważny dzisiaj
                if (carrier.includes("Deutsche Bahn")) {
                    validityStatus = "valid";
                    validityText = "15.10.2026 ✅ (Bilet Całodniowy Flex/D-Ticket)";
                } else {
                    validityStatus = "unknown";
                    validityText = "Wymagana weryfikacja manualna konduktora";
                }
            }

            renderResult(validityStatus, carrier, ticketType, passenger, route, validityText, codeId);
        }

        // Renderowanie tabeli i efektów
        function renderResult(status, carrier, type, passenger, route, validity, codeId) {
            let panel = document.getElementById('statusPanel');
            panel.style.display = 'block';
            panel.className = 'status-panel ' + status;

            if (status === 'valid') {
                panel.innerHTML = '✅ GIT – BILET WAŻNY!';
                playAudio('valid');
            } else if (status === 'invalid') {
                panel.innerHTML = '❌ NIEWAŻNY – ODRZUCONY!';
                playAudio('invalid');
            } else {
                panel.innerHTML = '⚠️ NIE WIEM – SPRAWDŹ RĘCZNIE!';
                playAudio('unknown');
            }

            document.getElementById('tdCarrier').innerText = carrier;
            document.getElementById('tdType').innerText = type;
            document.getElementById('tdPassenger').innerText = passenger;
            document.getElementById('tdRoute').innerText = route;
            document.getElementById('tdValidity').innerText = validity;
            document.getElementById('tdCode').innerText = codeId;

            document.getElementById('resTable').style.display = 'table';
        }
    </script>
</body>
</html>
