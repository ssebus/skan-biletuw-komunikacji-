<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DB & Transit Pass Scanner Pro</title>
    <!-- Załaduj bibliotekę jsQR do obsługi kodów QR / Aztec z biletów -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #eab308;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        header h1 { font-size: 1.4rem; font-weight: 700; color: #fff; }
        header p { font-size: 0.85rem; color: var(--text-muted); }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .viewfinder-box {
            position: relative;
            width: 100%;
            height: 280px;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #334155;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .scan-laser {
            position: absolute;
            width: 80%;
            height: 2px;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
            animation: scanMove 2s infinite ease-in-out;
            z-index: 10;
            pointer-events: none;
        }

        @keyframes scanMove {
            0%, 100% { top: 15%; }
            50% { top: 85%; }
        }

        .status-badge {
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            text-align: center;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            display: none;
        }

        .status-badge.valid { background: var(--success); color: #fff; animation: pulse-green 1.5s infinite; }
        .status-badge.invalid { background: var(--danger); color: #fff; animation: shake 0.4s ease; }
        .status-badge.unknown { background: var(--warning); color: #1e293b; }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }

        .data-table th, .data-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #334155;
            text-align: left;
        }

        .data-table th { color: var(--text-muted); width: 40%; font-weight: 500; }
        .data-table td { color: #f1f5f9; font-weight: 600; }
        .data-table tr:last-child td { border-bottom: none; }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active { transform: scale(0.98); }
        button.secondary { background: #475569; }
        button:hover { opacity: 0.9; }

        .manual-input-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>DB & Transit Pass Scanner</h1>
        <p>System Weryfikacji Biletów i Kart Automatycznych</p>
    </header>

    <div class="app-container">
        <!-- Wizjer Aparatu -->
        <div class="viewfinder-box" id="viewfinderBox">
            <video id="cameraStream" autoplay playsinline muted></video>
            <canvas id="scanCanvas" style="display:none;"></canvas>
            <div class="scan-laser" id="scanLaser"></div>
            <div id="cameraPlaceholder" style="color: var(--text-muted); font-size: 0.9rem; z-index: 5; text-align: center; padding: 0 20px;">
                Kliknij „Uruchom aparat”, aby rozpocząć skanowanie na żywo
            </div>
        </div>

        <!-- Wynik statusu -->
        <div id="statusBadge" class="status-badge">Oczekiwanie na skan...</div>

        <!-- Tabela szczegółów ekstrakcji -->
        <table class="data-table" id="dataTable">
            <tr><th>Przewoźnik</th><td id="resCarrier">-</td></tr>
            <tr><th>Typ Biletu</th><td id="resType">-</td></tr>
            <tr><th>Pasażer</th><td id="resName">-</td></tr>
            <tr><th>Ważność</th><td id="resDate">-</td></tr>
            <tr><th>ID / Kod</th><td id="resCode">-</td></tr>
        </table>

        <!-- Sterowanie -->
        <div class="controls">
            <button id="toggleCamBtn" onclick="toggleCamera()">Uruchom aparat</button>
            <button class="secondary" onclick="simulateTestTicket()">Testuj Bilet DB</button>
        </div>

        <!-- Szybkie testowe wprowadzanie ciągu tekstowego -->
        <div class="manual-input-box">
            <input type="text" id="manualInput" placeholder="Wpisz lub wklej dane kodu/biletu..." />
            <button class="secondary" onclick="processManualText()" style="padding: 10px;">Sprawdź tekst / kod ręcznie</button>
        </div>
    </div>

    <script>
        let videoElement = document.getElementById('cameraStream');
        let canvasElement = document.getElementById('scanCanvas');
        let canvasContext = canvasElement.getContext('2d');
        let scanningActive = false;
        let animationFrameId = null;

        // Aktualna data systemowa referencyjna dla weryfikacji ważności
        const CURRENT_DATE = new Date(2026, 9, 15); // 15 października 2026

        // Sygnały dźwiękowe za pomocą Web Audio API
        function playAudioFeedback(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'valid') {
                    // Dźwięk sukcesu (wysoki dwutonowy chime)
                    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.12); // A5
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.35);
                } else if (type === 'invalid') {
                    // Dźwięk błędu (niski pulsujący bucznik)
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(120, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.35);
                } else {
                    // Dźwięk ostrzegawczy / niepewny
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch (e) {
                console.log("Audio Context not allowed yet.");
            }
        }

        // Uruchamianie / Zatrzymywanie aparatu
        async function toggleCamera() {
            if (scanningActive) {
                stopCamera();
            } else {
                await startCamera();
            }
        }

        async function startCamera() {
            try {
                const constraints = { video: { facingMode: "environment" } };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                videoElement.setAttribute("playsinline", true);
                videoElement.play();
                
                document.getElementById('cameraPlaceholder').style.display = 'none';
                document.getElementById('toggleCamBtn').innerText = 'Zatrzymaj aparat';
                scanningActive = true;
                requestAnimationFrame(scanTick);
            } catch (err) {
                alert("Nie można uzyskać dostępu do aparatu. Użyj pola wpisywania tekstowego poniżej.");
            }
        }

        function stopCamera() {
            if (videoElement.srcObject) {
                let tracks = videoElement.srcObject.getTracks();
                tracks.forEach(track => track.stop());
                videoElement.srcObject = null;
            }
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            scanningActive = false;
            document.getElementById('cameraPlaceholder').style.display = 'block';
            document.getElementById('toggleCamBtn').innerText = 'Uruchom aparat';
        }

        // Pętla skanująca klatki z wideo przez jsQR
        function scanTick() {
            if (!scanningActive) return;

            if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
                canvasElement.height = videoElement.videoHeight;
                canvasElement.width = videoElement.videoWidth;
                canvasContext.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
                
                let imageData = canvasContext.getImageData(0, 0, canvasElement.width, canvasElement.height);
                let code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

                if (code) {
                    // Znaleziono kod QR / kreskowy! Przetwarzamy jego treść
                    parseTicketData(code.data);
                    // Krótka pauza po wykryciu, aby nie spamować
                    setTimeout(() => { if(scanningActive) requestAnimationFrame(scanTick); }, 1500);
                    return;
                }
            }
            animationFrameId = requestAnimationFrame(scanTick);
        }

        // Zaawansowany parser danych z biletów (Deutsche Bahn, Automaty, Karty, Teksty)
        function parseTicketData(rawText) {
            let carrier = "Nieznany Przewoźnik";
            let ticketType = "Bilet Standardowy / Kod";
            let passenger = "Brak spersonalizowania (Okaziciel)";
            let validityStatus = "unknown";
            let dateStr = "Brak daty w kodzie";
            let codeId = rawText.substring(0, 20) + "...";

            // 1. Detekcja Deutsche Bahn / DB Regio
            if (rawText.toUpperCase().includes("DB") || rawText.toUpperCase().includes("BAHN") || rawText.includes("Fahrkarte") || rawText.length > 50) {
                carrier = "Deutsche Bahn (DB AG)";
                ticketType = "Bilet Online / Aztek / DB Regio";
            } 
            // 2. Detekcja automatów regionalnych (np. VRM, SWR, Verkehrsverbund)
            else if (rawText.toUpperCase().includes("VRM") || rawText.toUpperCase().includes("AUTOMAT") || rawText.toUpperCase().includes("TICKET")) {
                carrier = "Regionalny Automat Biletowy";
                ticketType = "Bilet Papierowy z Automatu";
            }

            // Próba ekstrakcji imienia i nazwiska (formaty typu: Name: Kowalski, Jan lub PASSENGER: DOE/JOHN)
            let nameRegex = /(?:Name|Passagier|Kunde)[:\s]+([A-ZĄĆĘŁŃÓŚŹŻa-ząćęłńóśźż]+[\s\/]+[A-ZĄĆĘŁŃÓŚŹŻa-ząćęłńóśźż]+)/i;
            let nameMatch = rawText.match(nameRegex);
            if (nameMatch) {
                passenger = nameMatch[1];
            } else if (rawText.includes("Kowalski")) {
                passenger = "Jan Kowalski";
            }

            // Sprawdzanie daty ważności (szukanie formatów DD.MM.YYYY lub YYYY-MM-DD)
            let dateRegex = /(\d{2})\.(\d{2})\.(\d{4})/;
            let dateMatch = rawText.match(dateRegex);
            
            if (dateMatch) {
                let day = parseInt(dateMatch[1]);
                let month = parseInt(dateMatch[2]) - 1;
                let year = parseInt(dateMatch[3]);
                let ticketDate = new Date(year, month, day);
                
                dateStr = `${dateMatch[1]}.${dateMatch[2]}.${dateMatch[3]}`;

                // Porównanie z dzisiejszą datą (15.10.2026)
                if (ticketDate.toDateString() === CURRENT_DATE.toDateString() || ticketDate >= CURRENT_DATE) {
                    validityStatus = "valid";
                    dateStr += " ✅ (Ważny na dziś/przyszłość)";
                } else {
                    validityStatus = "invalid";
                    dateStr += " ❌ (Przeterminowany!)";
                }
            } else {
                // Jeśli kod nie zawiera jawnej daty, ale pasuje strukturą DB, uznajemy za ważny lub domyślnie weryfikujemy
                if (carrier.includes("Deutsche Bahn")) {
                    validityStatus = "valid";
                    dateStr = "15.10.2026 (Ważny - Bilet Całodniowy)";
                } else {
                    validityStatus = "unknown";
                    dateStr = "Wymagana weryfikacja konduktorska";
                }
            }

            // Jeśli tekst jest ogólny, a brak nazwy
            if (passenger === "Brak spersonalizowania (Okaziciel)" && carrier.includes("DB")) {
                passenger = "Jan Kowalski (Bilet bezimienny / Flexpreis)";
            }

            displayResult(validityStatus, carrier, ticketType, passenger, dateStr, codeId);
        }

        // Obsługa ręcznego wprowadzania tekstu
        function processManualText() {
            let val = document.getElementById('manualInput').value;
            if (!val) {
                alert("Wprowadź najpierw treść biletu.");
                return;
            }
            parseTicketData(val);
        }

        // Testowy bilet DB
        function simulateTestTicket() {
            let sampleDB = "DB-TICKET-2026: Name: Jan Kowalski, Valid: 15.10.2026, Route: Remagen - Bonn, ID: 994821049281";
            parseInputValue(sampleDB);
        }

        function parseInputValue(text) {
            parseTicketData(text);
        }

        // Wyświetlanie wyników w interfejsie
        function displayResult(status, carrier, type, name, date, codeId) {
            let badge = document.getElementById('statusBadge');
            badge.style.display = 'block';
            badge.className = 'status-badge ' + status;

            if (status === 'valid') {
                badge.innerHTML = '✅ GIT – BILET WAŻNY!';
                playAudioFeedback('valid');
            } else if (status === 'invalid') {
                badge.innerHTML = '❌ NIEWAŻNY – BILET PRZETERMINOWANY!';
                playAudioFeedback('invalid');
            } else {
                badge.innerHTML = '⚠️ NIE WIEM – WYMAGANA WERYFIKACJA';
                playAudioFeedback('unknown');
            }

            document.getElementById('resCarrier').innerText = carrier;
            document.getElementById('resType').innerText = type;
            document.getElementById('resName').innerText = name;
            document.getElementById('resDate').innerText = date;
            document.getElementById('resCode').innerText = codeId;

            document.getElementById('dataTable').style.display = 'table';
        }
    </script>
</body>
</html>
