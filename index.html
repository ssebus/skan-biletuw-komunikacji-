<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Card & Ticket OCR Inspector</title>
    <!-- Ładowanie biblioteki Tesseract.js do optycznego odczytu tekstu z obrazu w ramce -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        :root {
            --bg: #030712;
            --panel: #0f172a;
            --border: #1e293b;
            --accent: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #eab308;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        h1 { font-size: 1.15rem; margin-bottom: 2px; text-align: center; }
        p.sub { font-size: 0.7rem; color: var(--muted); margin-bottom: 14px; text-align: center; }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--panel);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Wizjer z ramką OCR na środku */
        .viewfinder-box {
            position: relative;
            width: 100%;
            height: 260px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Ramka nakładana, w której użytkownik umieszcza kartę/bilet */
        .ocr-frame {
            position: absolute;
            width: 85%;
            height: 130px;
            border: 2px solid var(--accent);
            border-radius: 10px;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ocr-frame::after {
            content: 'Umieść bilet/kartę w ramce';
            position: absolute;
            bottom: -22px;
            font-size: 0.65rem;
            color: var(--muted);
            letter-spacing: 0.5px;
        }

        .status-badge {
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            text-align: center;
            font-size: 1rem;
            display: none;
        }
        .status-badge.valid { background: var(--success); color: white; animation: pulse-green 1.5s infinite; }
        .status-badge.invalid { background: var(--danger); color: white; animation: shake 0.4s; }
        .status-badge.unknown { background: var(--warning); color: #000; }
        .status-badge.not-ticket { background: #475569; color: white; }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        /* Tabela odczytanych danych tekstowych */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }
        .data-table th, .data-table td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            word-break: break-all;
        }
        .data-table th { color: var(--muted); width: 38%; font-weight: 500; }
        .data-table td { color: #fff; font-weight: 600; }
        .data-table tr:last-child td { border-bottom: none; }

        .scan-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .scan-btn:active { transform: scale(0.98); }
        .scan-btn:disabled { background: #475569; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>Card & Ticket OCR Inspector</h1>
    <p class="sub">Skanuje tekst bezpośrednio z karty lub biletu w ramce</p>

    <div class="container">
        <div class="viewfinder-box">
            <video id="videoEl" autoplay playsinline muted></video>
            <div class="ocr-frame"></div>
            <div id="camMsg" style="position:absolute; color:var(--muted); font-size:0.8rem; z-index:5; text-align:center; padding:0 20px;">
                Uruchamianie aparatu...
            </div>
        </div>

        <div id="statusBadge" class="status-badge">Oczekiwanie na skan...</div>

        <table id="resultTable" class="data-table">
            <tbody id="tableBody"></tbody>
        </table>

        <button id="scanBtn" class="scan-btn" onclick="scanCardText()">🔍 Skanuj tekst z karty / biletu</button>
    </div>

    <canvas id="cropCanvas" style="display:none;"></canvas>

    <script>
        let video = document.getElementById('videoEl');
        let cropCanvas = document.getElementById('cropCanvas');
        let ctx = cropCanvas.getContext('2d');

        // Dzisiejsza data systemowa: 15 października 2026
        const TODAY = new Date(2026, 9, 15);

        async function initCamera() {
            try {
                let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                video.play();
                document.getElementById('camMsg').style.display = 'none';
            } catch(e) {
                document.getElementById('camMsg').innerText = "Brak dostępu do aparatu.";
            }
        }
        initCamera();

        function playSound(type) {
            try {
                let ac = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ac.createOscillator();
                let g = ac.createGain();
                osc.connect(g); g.connect(ac.destination);
                if(type === 'valid') {
                    osc.frequency.setValueAtTime(587.33, ac.currentTime);
                    osc.frequency.setValueAtTime(880, ac.currentTime + 0.1);
                    g.gain.setValueAtTime(0.1, ac.currentTime);
                    osc.start(); osc.stop(ac.currentTime + 0.3);
                } else if(type === 'invalid') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ac.currentTime);
                    g.gain.setValueAtTime(0.15, ac.currentTime);
                    osc.start(); osc.stop(ac.currentTime + 0.35);
                } else {
                    osc.frequency.setValueAtTime(350, ac.currentTime);
                    g.gain.setValueAtTime(0.1, ac.currentTime);
                    osc.start(); osc.stop(ac.currentTime + 0.25);
                }
            } catch(e) {}
        }

        // Główna funkcja wycinająca obszar z ramki i uruchamiająca OCR
        async function scanCardText() {
            if (video.readyState !== video.HAVE_ENOUGH_DATA) {
                alert("Aparat nie jest gotowy.");
                return;
            }

            let btn = document.getElementById('scanBtn');
            btn.disabled = true;
            btn.innerText = "⏳ Odczytuję tekst z karty...";

            // Pobierz wymiary wideo
            let vWidth = video.videoWidth;
            let vHeight = video.videoHeight;

            // Wyznacz współrzędne ramki OCR (85% szerokości, 130px wysokości na środku)
            let boxW = vWidth * 0.85;
            let boxH = 150;
            let boxX = (vWidth - boxW) / 2;
            let boxY = (vHeight - boxH) / 2;

            cropCanvas.width = boxW;
            cropCanvas.height = boxH;

            // Wytnij dokładnie ten wycinek obrazu z wideo do pliku graficznego/kanwy
            ctx.drawImage(video, boxX, boxY, boxW, boxH, 0, 0, boxW, boxH);

            // Uruchomienie silnika Tesseract OCR w językach polskim, niemieckim i angielskim
            try {
                let result = await Tesseract.recognize(
                    cropCanvas,
                    'deu+pol+eng',
                    { 
                        logger: m => {} // Można śledzić postęp w konsoli
                    }
                );

                let extractedText = result.data.text.trim();
                analyzeExtractedText(extractedText);

            } catch (err) {
                showResult("unknown", { "Błąd": "Nie udało się odczytać tekstu. Spróbuj ponownie." });
            } finally {
                btn.disabled = false;
                btn.innerText = "🔍 Skanuj tekst z karty / biletu";
            }
        }

        // Analiza tekstu odczytanego wizualnie z karty
        function analyzeExtractedText(text) {
            let fields = {};
            let status = "unknown";

            fields["Odczytany tekst"] = text.replace(/\n/g, " ") || "(Brak tekstu)";

            // Sprawdzenie, czy to w ogóle bilet / karta transportowa (szukamy słów kluczowych lub cyfr)
            let hasKeywords = /bahn|ticket|fahrkarte|vrm|gueltig|gül|goltig|gültig|abo|deutschland|valid|preis|eur/i.test(text);
            let hasNumbers = /\d{2}[\.\/\-]\d{2}[\.\/\-]\d{2,4}/.test(text) || text.length > 5;

            if (!text || (!hasKeywords && !hasNumbers)) {
                showResult("not-ticket", fields);
                return;
            }

            // Szukanie daty w formacie DD.MM.YYYY lub podobnym
            let dateRegex = /(\d{2})[\.\/\-](\d{2})[\.\/\-](\d{2,4})/g;
            let dates = [...text.matchAll(dateRegex)];

            if (dates.length > 0) {
                let dMatch = dates[dates.length - 1];
                let day = parseInt(dMatch[1]);
                let month = parseInt(dMatch[2]) - 1;
                let year = parseInt(dMatch[3]);
                if (year < 100) year += 2000; // np. '26 na 2026

                let ticketDate = new Date(year, month, day, 23, 59, 59);
                fields["Wykryta data"] = `${dMatch[1]}.${dMatch[2]}.${year}`;

                if (ticketDate >= TODAY) {
                    status = "valid";
                    fields["Ocena ważności"] = "Ważny (Data aktualna)";
                } else {
                    status = "invalid";
                    fields["Ocena ważności"] = "Nieważny (Przeterminowany!)";
                }
            } else {
                // Jeśli karta/bilet nie ma jawnej daty na wierzchu, ale ma słowa kluczowe (np. stała karta D-Ticket bez daty drukowanej)
                if (/deutschland|abo|sub/i.test(text)) {
                    status = "valid";
                    fields["Ocena ważności"] = "Ważny (Karta abonamentowa / D-Ticket)";
                } else {
                    status = "unknown";
                    fields["Ocena ważności"] = "Niepewny – brak widocznej daty w ramce";
                }
            }

            showResult(status, fields);
        }

        function showResult(status, fields) {
            let badge = document.getElementById('statusBadge');
            badge.style.display = 'block';
            badge.className = 'status-badge ' + status;

            if (status === 'valid') {
                badge.innerText = '🟢 GIT – Bilet / Karta jest WAŻNA';
                playSound('valid');
            } else if (status === 'invalid') {
                badge.innerText = '🔴 NIEWAŻNY – Termin minął';
                playSound('invalid');
            } else if (status === 'unknown') {
                badge.innerText = '🟡 NIE WIEM – Brak pewności co do daty';
                playSound('unknown');
            } else {
                badge.innerText = '⚠️ TO NIE WYGLĄDA NA BILET';
                playSound('invalid');
            }

            let tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            for (let [key, val] of Object.entries(fields)) {
                tbody.innerHTML += `<tr><th>${key}</th><td>${val}</td></tr>`;
            }

            document.getElementById('resultTable').style.display = 'table';
        }
    </script>
</body>
</html>
